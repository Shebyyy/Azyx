name: Build and Release Azyx Beta

on:
  push:
    tags:
      - "v*-beta*"
  workflow_dispatch:
    inputs:
      version:
        description: "Pubspec version for this beta build (e.g. 2.6.4-beta+4)"
        required: true
        default: ""

env:
  FLUTTER_VERSION: "3.41.6"
  JAVA_VERSION: "17"
  MAIN_REPO: "reyyuuki/Azyx"

jobs:
  # ─────────────────────────────────────────────
  # Resolve the version/tag once, share with every platform job
  # ─────────────────────────────────────────────
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Resolve Beta Version
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved beta version: $VERSION (tag v$VERSION)"

  # ─────────────────────────────────────────────
  # Platform builds via matrix
  # ─────────────────────────────────────────────
  build:
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            artifact_pattern: "main-repo/build/app/outputs/flutter-apk/Azyx-Beta-Android-*.apk"
          - platform: ios
            os: macos-latest
            artifact_pattern: "main-repo/Azyx-Beta-iOS-*.ipa"
          - platform: linux
            os: ubuntu-latest
            artifact_pattern: "main-repo/Azyx-Beta-Linux.zip"
          - platform: windows
            os: windows-latest
            artifact_pattern: "main-repo/build/windows/x64/runner/Release/Azyx-Beta-Windows.zip"
          - platform: macos
            os: macos-latest
            artifact_pattern: "main-repo/build/macos/Release/Azyx-Beta.dmg"
    continue-on-error: ${{ matrix.platform != 'android' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: main-repo
    steps:
      # ── Common: checkout beta repo, clone main, apply rename ──
      - name: Checkout Beta Repo
        uses: actions/checkout@v3
        with:
          path: beta-repo

      - name: Clone Main Azyx Repository
        working-directory: .
        shell: bash
        run: git clone --depth 1 https://github.com/${{ env.MAIN_REPO }}.git main-repo

      - name: Copy Beta Assets to Main Repo
        working-directory: .
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          case "$PLATFORM" in
            android)
              if [ -n "$(ls -A beta-repo/logo/android/app/src/main/res 2>/dev/null | grep -v .gitkeep)" ]; then
                cp -r beta-repo/logo/android/app/src/main/res/* main-repo/android/app/src/main/res/
                echo "✅ Android icons copied"
              else
                echo "⚠️  No beta Android icons, keeping stable icons"
              fi
              ;;
            ios)
              if [ -n "$(ls -A beta-repo/logo/ios/Runner/Assets.xcassets/AppIcon.appiconset 2>/dev/null | grep -v .gitkeep)" ]; then
                cp -r beta-repo/logo/ios/Runner/Assets.xcassets/AppIcon.appiconset/* main-repo/ios/Runner/Assets.xcassets/AppIcon.appiconset/
                echo "✅ iOS icons copied"
              else
                echo "⚠️  No beta iOS icons, keeping stable icons"
              fi
              ;;
            macos)
              if [ -n "$(ls -A beta-repo/logo/macos/Runner/Assets.xcassets/AppIcon.appiconset 2>/dev/null | grep -v .gitkeep)" ]; then
                cp -r beta-repo/logo/macos/Runner/Assets.xcassets/AppIcon.appiconset/* main-repo/macos/Runner/Assets.xcassets/AppIcon.appiconset/
                echo "✅ macOS icons copied"
              else
                echo "⚠️  No beta macOS icons, keeping stable icons"
              fi
              ;;
            windows)
              if [ -f beta-repo/logo/windows/runner/resources/app_icon.ico ]; then
                cp beta-repo/logo/windows/runner/resources/app_icon.ico main-repo/windows/runner/resources/
                echo "✅ Windows icon copied"
              else
                echo "⚠️  No beta Windows icon, keeping stable icon"
              fi
              ;;
          esac

          cp beta-repo/scripts/rename_app.sh main-repo/scripts/rename_app.sh
          chmod +x main-repo/scripts/rename_app.sh
          echo "✅ Rename script copied"

      - name: Run Beta Rename Script
        shell: bash
        run: bash scripts/rename_app.sh "${{ needs.resolve-tag.outputs.version }}"

      # ── Platform-specific setup ──
      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: "adopt"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang mpv libgtk-3-dev libblkid-dev liblzma-dev pkg-config libmpv-dev webkit2gtk-4.1

      # ── Common: Flutter setup + env + deps ──
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup .env File
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          REDIRECT_URL: ${{ secrets.REDIRECT_URL }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
        run: |
          cat > .env <<EOF
          CLIENT_ID=$CLIENT_ID
          CLIENT_SECRET=$CLIENT_SECRET
          MAL_CLIENT_ID=$MAL_CLIENT_ID
          MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET
          REDIRECT_URL=$REDIRECT_URL
          SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID
          SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET
          BOT_API_SECRET=$BOT_API_SECRET
          BOT_BASE_URL=$BOT_BASE_URL
          EOF

      - name: Clean Flutter build cache
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      # ── Platform-specific build + package + release ──
      # Android
      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-beta-${{ hashFiles('main-repo/android/**/*.gradle*', 'main-repo/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-beta-

      - name: Cache CMake
        if: matrix.platform == 'android'
        id: cache-cmake
        uses: actions/cache@v3
        with:
          path: ~/cmake
          key: cmake-3.18.1-linux-x64

      - name: Download and Install CMake 3.18.1
        if: matrix.platform == 'android' && steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/cmake
          cd $HOME/cmake
          wget https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
          tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
          ln -s $HOME/cmake/cmake-3.18.1-Linux-x86_64/bin/cmake $HOME/cmake/cmake

      - name: Setup CMake path in local.properties
        if: matrix.platform == 'android'
        run: |
          CMAKE_DIR="$HOME/cmake/cmake-3.18.1-Linux-x86_64"
          echo "cmake.dir=$CMAKE_DIR" >> android/local.properties

      - name: Download keystore
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/azyx.jks

      - name: Set up signing variables
        if: matrix.platform == 'android'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=azyx.jks" >> android/key.properties

      - name: Build Android
        if: matrix.platform == 'android'
        run: |
          flutter build apk --split-per-abi
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Azyx-Beta-Android-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Azyx-Beta-Android-arm64.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/Azyx-Beta-Android-x86_64.apk
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Azyx-Beta-Android-universal.apk

      # iOS
      - name: Build iOS
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r Azyx-Beta-iOS-${{ needs.resolve-tag.outputs.tag }}.ipa Payload
          mv Azyx-Beta-iOS-${{ needs.resolve-tag.outputs.tag }}.ipa ../../../

      # Linux
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release
          cd build/linux/x64/release
          mkdir -p bundle/lib
          cp ../../../../linux-fix/* bundle/lib/ || true
          zip -r ../../../../Azyx-Beta-Linux.zip .

      # Windows
      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          flutter build windows --release
          cd build/windows/x64/runner/Release
          powershell -Command "Compress-Archive -Path * -DestinationPath Azyx-Beta-Windows.zip"

      # macOS
      - name: Build macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          flutter build macos --release
          set -e
          APP_PATH="build/macos/Build/Products/Release/azyx_beta.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/macos/Build/Products/Release/azyx.app"
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: built .app not found"
            ls -la build/macos/Build/Products/Release/ || true
            exit 1
          fi
          mkdir -p build/macos/Release
          mkdir -p temp_dir
          cp -r "$APP_PATH" temp_dir/
          ln -s /Applications temp_dir/Applications
          hdiutil create -volname "Azyx Beta" -srcfolder temp_dir -ov -format UDZO build/macos/Release/Azyx-Beta.dmg
          rm -rf temp_dir

      # ── Common: Release ──
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ matrix.artifact_pattern }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          tag: ${{ needs.resolve-tag.outputs.tag }}
