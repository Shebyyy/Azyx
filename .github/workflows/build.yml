name: Build and Release Azyx Beta

on:
  push:
    tags:
      - "v*-beta*"
  workflow_dispatch:
    inputs:
      version:
        description: "Pubspec version for this beta build (e.g. 2.6.4-beta+4)"
        required: true
        default: ""

jobs:
  # ─────────────────────────────────────────────
  # Resolve the version/tag once, share with every platform job
  # ─────────────────────────────────────────────
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Resolve Beta Version
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved beta version: $VERSION (tag v$VERSION)"

  build-android:
    needs: resolve-tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-repo
    steps:
      - name: Checkout Beta Repo
        uses: actions/checkout@v3
        with:
          path: beta-repo

      - name: Clone Main Azyx Repository
        working-directory: .
        run: |
          echo "════════════════════════════════════════════"
          echo "  Cloning Main Repository"
          echo "════════════════════════════════════════════"
          git clone --depth 1 https://github.com/reyyuuki/Azyx.git main-repo
          echo "✅ Cloned reyyuuki/Azyx to main-repo/"

      - name: Copy Beta Assets to Main Repo
        working-directory: .
        run: |
          echo "════════════════════════════════════════════"
          echo "  Copying Beta Assets"
          echo "════════════════════════════════════════════"

          echo "📱 Copying Android icons..."
          if [ -n "$(ls -A beta-repo/logo/android/app/src/main/res 2>/dev/null | grep -v .gitkeep)" ]; then
            cp -r beta-repo/logo/android/app/src/main/res/* main-repo/android/app/src/main/res/
            echo "✅ Android icons copied"
          else
            echo "⚠️  No beta Android icons in beta-repo/logo yet, keeping stable icons"
          fi

          echo "📜 Copying rename script..."
          cp beta-repo/scripts/rename_app.sh main-repo/scripts/rename_app.sh
          chmod +x main-repo/scripts/rename_app.sh
          echo "✅ Rename script copied"

      - name: Run Beta Rename Script
        run: ./scripts/rename_app.sh "${{ needs.resolve-tag.outputs.version }}"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "adopt"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-beta-${{ hashFiles('main-repo/android/**/*.gradle*', 'main-repo/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-beta-

      - name: Cache CMake
        id: cache-cmake
        uses: actions/cache@v3
        with:
          path: ~/cmake
          key: cmake-3.18.1-linux-x64

      - name: Download and Install CMake 3.18.1
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/cmake
          cd $HOME/cmake
          wget https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
          tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
          ln -s $HOME/cmake/cmake-3.18.1-Linux-x86_64/bin/cmake $HOME/cmake/cmake
          $HOME/cmake/cmake-3.18.1-Linux-x86_64/bin/cmake --version

      - name: Setup CMake path in local.properties
        run: |
          CMAKE_DIR="$HOME/cmake/cmake-3.18.1-Linux-x86_64"
          echo "cmake.dir=$CMAKE_DIR" >> android/local.properties
          echo "CMake directory set to: $CMAKE_DIR"
          cat android/local.properties

      - name: Download keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/azyx.jks

      - name: Set up signing variables
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=azyx.jks" >> android/key.properties

      - name: Setup .env File
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          REDIRECT_URL: ${{ secrets.REDIRECT_URL }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
        run: |
          echo "CLIENT_ID=$CLIENT_ID" > .env
          echo "CLIENT_SECRET=$CLIENT_SECRET" >> .env
          echo "MAL_CLIENT_ID=$MAL_CLIENT_ID" >> .env
          echo "MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET" >> .env
          echo "REDIRECT_URL=$REDIRECT_URL" >> .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" >> .env
          echo "BOT_API_SECRET=$BOT_API_SECRET" >> .env
          echo "BOT_BASE_URL=$BOT_BASE_URL" >> .env

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android with Split ABI
        run: flutter build apk --split-per-abi

      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Azyx-Beta-Android-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Azyx-Beta-Android-arm64.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/Azyx-Beta-Android-x86_64.apk

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Rename Universal APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Azyx-Beta-Android-universal.apk

      - name: Release Android APKs
        uses: ncipollo/release-action@v1
        with:
          artifacts: "main-repo/build/app/outputs/flutter-apk/Azyx-Beta-Android-*.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          tag: ${{ needs.resolve-tag.outputs.tag }}

  build-ios:
    needs: resolve-tag
    runs-on: macos-latest
    defaults:
      run:
        working-directory: main-repo
    steps:
      - name: Checkout Beta Repo
        uses: actions/checkout@v3
        with:
          path: beta-repo

      - name: Clone Main Azyx Repository
        working-directory: .
        run: git clone --depth 1 https://github.com/reyyuuki/Azyx.git main-repo

      - name: Copy Beta Assets to Main Repo
        working-directory: .
        run: |
          if [ -n "$(ls -A beta-repo/logo/ios/Runner/Assets.xcassets/AppIcon.appiconset 2>/dev/null | grep -v .gitkeep)" ]; then
            cp -r beta-repo/logo/ios/Runner/Assets.xcassets/AppIcon.appiconset/* main-repo/ios/Runner/Assets.xcassets/AppIcon.appiconset/
            echo "✅ iOS icons copied"
          else
            echo "⚠️  No beta iOS icons in beta-repo/logo yet, keeping stable icons"
          fi
          cp beta-repo/scripts/rename_app.sh main-repo/scripts/rename_app.sh
          chmod +x main-repo/scripts/rename_app.sh

      - name: Run Beta Rename Script
        run: ./scripts/rename_app.sh "${{ needs.resolve-tag.outputs.version }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          cache: true

      - name: Setup .env File
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          REDIRECT_URL: ${{ secrets.REDIRECT_URL }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
        run: |
          echo "CLIENT_ID=$CLIENT_ID" > .env
          echo "CLIENT_SECRET=$CLIENT_SECRET" >> .env
          echo "MAL_CLIENT_ID=$MAL_CLIENT_ID" >> .env
          echo "MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET" >> .env
          echo "REDIRECT_URL=$REDIRECT_URL" >> .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" >> .env
          echo "BOT_API_SECRET=$BOT_API_SECRET" >> .env
          echo "BOT_BASE_URL=$BOT_BASE_URL" >> .env

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r Azyx-Beta-iOS-${{ needs.resolve-tag.outputs.tag }}.ipa Payload
          mv Azyx-Beta-iOS-${{ needs.resolve-tag.outputs.tag }}.ipa ../../../

      - name: Release iOS IPA
        uses: ncipollo/release-action@v1
        with:
          artifacts: "main-repo/Azyx-Beta-iOS-*.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          tag: ${{ needs.resolve-tag.outputs.tag }}

  build-linux:
    needs: resolve-tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-repo
    steps:
      - name: Checkout Beta Repo
        uses: actions/checkout@v3
        with:
          path: beta-repo

      - name: Clone Main Azyx Repository
        working-directory: .
        run: git clone --depth 1 https://github.com/reyyuuki/Azyx.git main-repo

      - name: Copy Beta Assets to Main Repo
        working-directory: .
        run: |
          cp beta-repo/scripts/rename_app.sh main-repo/scripts/rename_app.sh
          chmod +x main-repo/scripts/rename_app.sh

      - name: Run Beta Rename Script
        run: ./scripts/rename_app.sh "${{ needs.resolve-tag.outputs.version }}"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang mpv libgtk-3-dev libblkid-dev liblzma-dev pkg-config libmpv-dev webkit2gtk-4.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          cache: true

      - name: Setup .env File
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          REDIRECT_URL: ${{ secrets.REDIRECT_URL }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
        run: |
          echo "CLIENT_ID=$CLIENT_ID" > .env
          echo "CLIENT_SECRET=$CLIENT_SECRET" >> .env
          echo "MAL_CLIENT_ID=$MAL_CLIENT_ID" >> .env
          echo "MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET" >> .env
          echo "REDIRECT_URL=$REDIRECT_URL" >> .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" >> .env
          echo "BOT_API_SECRET=$BOT_API_SECRET" >> .env
          echo "BOT_BASE_URL=$BOT_BASE_URL" >> .env

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Zip Linux Artifacts
        run: |
          cd build/linux/x64/release
          mkdir -p bundle/lib
          cp ../../../linux-fix/* bundle/lib/ || true
          zip -r ../../../../Azyx-Beta-Linux.zip .

      - name: Release Linux Build
        uses: ncipollo/release-action@v1
        with:
          artifacts: "main-repo/Azyx-Beta-Linux.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          tag: ${{ needs.resolve-tag.outputs.tag }}

  build-windows:
    needs: resolve-tag
    runs-on: windows-latest
    defaults:
      run:
        working-directory: main-repo
    steps:
      - name: Checkout Beta Repo
        uses: actions/checkout@v3
        with:
          path: beta-repo

      - name: Clone Main Azyx Repository
        shell: bash
        working-directory: .
        run: git clone --depth 1 https://github.com/reyyuuki/Azyx.git main-repo

      - name: Copy Beta Assets to Main Repo
        shell: bash
        working-directory: .
        run: |
          if [ -f beta-repo/logo/windows/runner/resources/app_icon.ico ]; then
            cp beta-repo/logo/windows/runner/resources/app_icon.ico main-repo/windows/runner/resources/
            echo "✅ Windows icon copied"
          else
            echo "⚠️  No beta Windows icon in beta-repo/logo yet, keeping stable icon"
          fi
          cp beta-repo/scripts/rename_app.sh main-repo/scripts/rename_app.sh

      - name: Run Beta Rename Script
        shell: bash
        run: bash scripts/rename_app.sh "${{ needs.resolve-tag.outputs.version }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          cache: true

      - name: Setup .env File
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          REDIRECT_URL: ${{ secrets.REDIRECT_URL }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
        run: |
          echo "CLIENT_ID=$CLIENT_ID" > .env
          echo "CLIENT_SECRET=$CLIENT_SECRET" >> .env
          echo "MAL_CLIENT_ID=$MAL_CLIENT_ID" >> .env
          echo "MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET" >> .env
          echo "REDIRECT_URL=$REDIRECT_URL" >> .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" >> .env
          echo "BOT_API_SECRET=$BOT_API_SECRET" >> .env
          echo "BOT_BASE_URL=$BOT_BASE_URL" >> .env

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP file for Windows Build
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath Azyx-Beta-Windows.zip

      - name: Release Windows Builds
        uses: ncipollo/release-action@v1
        with:
          artifacts: "main-repo/build/windows/x64/runner/Release/Azyx-Beta-Windows.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          tag: ${{ needs.resolve-tag.outputs.tag }}

  build-macos:
    needs: resolve-tag
    runs-on: macos-latest
    defaults:
      run:
        working-directory: main-repo
    steps:
      - name: Checkout Beta Repo
        uses: actions/checkout@v3
        with:
          path: beta-repo

      - name: Clone Main Azyx Repository
        working-directory: .
        run: git clone --depth 1 https://github.com/reyyuuki/Azyx.git main-repo

      - name: Copy Beta Assets to Main Repo
        working-directory: .
        run: |
          if [ -n "$(ls -A beta-repo/logo/macos/Runner/Assets.xcassets/AppIcon.appiconset 2>/dev/null | grep -v .gitkeep)" ]; then
            cp -r beta-repo/logo/macos/Runner/Assets.xcassets/AppIcon.appiconset/* main-repo/macos/Runner/Assets.xcassets/AppIcon.appiconset/
            echo "✅ macOS icons copied"
          else
            echo "⚠️  No beta macOS icons in beta-repo/logo yet, keeping stable icons"
          fi
          cp beta-repo/scripts/rename_app.sh main-repo/scripts/rename_app.sh
          chmod +x main-repo/scripts/rename_app.sh

      - name: Run Beta Rename Script
        run: ./scripts/rename_app.sh "${{ needs.resolve-tag.outputs.version }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          cache: true

      - name: Setup .env File
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          REDIRECT_URL: ${{ secrets.REDIRECT_URL }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
        run: |
          echo "CLIENT_ID=$CLIENT_ID" > .env
          echo "CLIENT_SECRET=$CLIENT_SECRET" >> .env
          echo "MAL_CLIENT_ID=$MAL_CLIENT_ID" >> .env
          echo "MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET" >> .env
          echo "REDIRECT_URL=$REDIRECT_URL" >> .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET" >> .env
          echo "BOT_API_SECRET=$BOT_API_SECRET" >> .env
          echo "BOT_BASE_URL=$BOT_BASE_URL" >> .env

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create DMG file for macOS Build
        run: |
          set -e
          APP_PATH="build/macos/Build/Products/Release/azyx_beta.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/macos/Build/Products/Release/azyx.app"
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: built .app not found"
            ls -la build/macos/Build/Products/Release/ || true
            exit 1
          fi

          mkdir -p build/macos/Release
          mkdir -p temp_dir
          cp -r "$APP_PATH" temp_dir/
          ln -s /Applications temp_dir/Applications

          hdiutil create \
            -volname "Azyx Beta" \
            -srcfolder temp_dir \
            -ov \
            -format UDZO \
            build/macos/Release/Azyx-Beta.dmg

          rm -rf temp_dir

      - name: Release macOS Builds
        uses: ncipollo/release-action@v1
        with:
          artifacts: "main-repo/build/macos/Release/Azyx-Beta.dmg"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          tag: ${{ needs.resolve-tag.outputs.tag }}

  generate-changelog:
    needs: [resolve-tag, build-android, build-ios, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Beta Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '\-beta' | sed -n '2p')
          CURRENT_TAG="${{ needs.resolve-tag.outputs.tag }}"
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "# Changelog" > CHANGELOG.md
          echo "## $CURRENT_TAG" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

          add_section() {
            local section_title="$1"
            local grep_pattern="$2"
            local commits=$(git log "$PREVIOUS_TAG"..HEAD --grep="$grep_pattern" --pretty=format:"* [\`%h\`](https://github.com/${{ github.repository }}/commit/%h): %s")
            if [ ! -z "$commits" ]; then
              echo "## $section_title" >> CHANGELOG.md
              echo "$commits" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi
          }

          add_section "🎉 New Features" "^feat:"
          add_section "🛠️ Bug Fixes & Improvements" "^fix:"
          add_section "🔧 Refactors" "^refactor:"
          add_section "🎨 Style Changes" "^style:"
          add_section "🚀 Performance Improvements" "^perf:"
          add_section "🧹 Chores & Documentation" "^(chore|docs):"

          cat CHANGELOG.md

      - name: Update Release with Changelog
        uses: ncipollo/release-action@v1
        with:
          bodyFile: "CHANGELOG.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          tag: ${{ needs.resolve-tag.outputs.tag }}
