name: changelog

on:
  workflow_run:
    workflows:
      - "Build and Release Azyx Beta"
    types:
      - completed
  workflow_dispatch:
    inputs:
      from_commit:
        description: "Commit SHA in the main Azyx repo to get changes AFTER (start point). Leave empty to use .last-beta-commit."
        required: false
      to_commit:
        description: "Commit SHA in the main Azyx repo to get changes BEFORE (end point). Defaults to HEAD."
        required: false
      current_tag:
        description: "Tag to attach this changelog/release to (optional, defaults to latest tag in this repo)"
        required: false

permissions:
  contents: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check Job Statuses
        id: check_jobs
        env:
          WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
          JOBS: ${{ toJSON(github.event.workflow_run.jobs) }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected, skipping job checks"
            echo "all_jobs_success=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$JOBS" ] || [ "$JOBS" == "null" ]; then
            echo "Warning: No job data available from workflow_run. Assuming failure."
            ALL_SUCCESS=false
          else
            ALL_SUCCESS=true
          fi

          REQUIRED_JOBS=("build")

          if [ -n "$JOBS" ] && [ "$JOBS" != "null" ]; then
            for JOB in "${REQUIRED_JOBS[@]}"; do
              JOB_STATUS=$(echo "$JOBS" | jq -c ".[] | select(.name | startswith(\"$JOB\")) | .conclusion")
              while read -r STATUS; do
                if [ -z "$STATUS" ] || [ "$STATUS" != '"success"' ]; then
                  echo "Matrix job for $JOB failed or was not found. Status: $STATUS"
                  ALL_SUCCESS=false
                  break 2
                fi
              done <<< "$JOB_STATUS"
              echo "All $JOB matrix jobs succeeded."
            done
          fi

          echo "all_jobs_success=$ALL_SUCCESS" >> $GITHUB_OUTPUT
        shell: /usr/bin/bash -e {0}

      - name: Checkout Beta Repo
        uses: actions/checkout@v4
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        with:
          fetch-depth: 0

      - name: Resolve Tag
        id: resolve_tag
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        run: |
          git fetch --tags
          if [ -n "${{ inputs.current_tag }}" ]; then
            CURRENT_TAG="${{ inputs.current_tag }}"
          else
            CURRENT_TAG=$(git tag --sort=-creatordate | head -n 1)
          fi
          echo "Resolved tag: $CURRENT_TAG"
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT

      - name: Clone Main Azyx Repository
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        run: |
          echo "════════════════════════════════════════════"
          echo "  Cloning Main Repository for Commits"
          echo "════════════════════════════════════════════"
          git clone https://github.com/reyyuuki/Azyx.git main-repo
          echo "✅ Cloned reyyuuki/Azyx to main-repo/"

      - name: Read Last Beta Commit
        id: get_last_commit
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        run: |
          if [ -n "${{ inputs.from_commit }}" ]; then
            echo "✅ Using manual input from_commit: ${{ inputs.from_commit }}"
            echo "last_commit=${{ inputs.from_commit }}" >> $GITHUB_OUTPUT
            echo "is_first_run=false" >> $GITHUB_OUTPUT
          elif [ -f ".last-beta-commit" ]; then
            LAST_COMMIT=$(cat .last-beta-commit)
            echo "✅ Found .last-beta-commit: $LAST_COMMIT"
            echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
            echo "is_first_run=false" >> $GITHUB_OUTPUT
          else
            echo "⚠️ .last-beta-commit not found, will use last 20 commits"
            echo "last_commit=" >> $GITHUB_OUTPUT
            echo "is_first_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Get Current Latest Commit SHA
        id: get_current_commit
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        run: |
          cd main-repo
          if [ -n "${{ inputs.to_commit }}" ]; then
            CURRENT_SHA="${{ inputs.to_commit }}"
          else
            CURRENT_SHA=$(git rev-parse HEAD)
          fi
          echo "current_commit=$CURRENT_SHA" >> $GITHUB_OUTPUT

      - name: Get Commits Since Last Build
        id: get_commits
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        run: |
          cd main-repo
          END_COMMIT="${{ steps.get_current_commit.outputs.current_commit }}"

          if [ "${{ steps.get_last_commit.outputs.is_first_run }}" = "true" ]; then
            echo "First run - getting last 20 commits up to $END_COMMIT"
            git log -20 --pretty=format:'%h|||%s' "$END_COMMIT" > commits.tmp
          else
            LAST_COMMIT="${{ steps.get_last_commit.outputs.last_commit }}"
            if git cat-file -e "$LAST_COMMIT" 2>/dev/null; then
              git log "$LAST_COMMIT".."$END_COMMIT" --pretty=format:'%h|||%s' > commits.tmp
            else
              echo "⚠️ Last commit $LAST_COMMIT not found in main-repo, using last 20 commits"
              git log -20 --pretty=format:'%h|||%s' "$END_COMMIT" > commits.tmp
            fi
          fi

          echo "Commits found:"
          cat commits.tmp

      - name: Categorize Commits
        id: categorize
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        run: |
          echo "Categorizing commits..."

          FEATURES=""
          BUG_FIXES=""
          REFACTORS=""
          STYLE_CHANGES=""
          PERFORMANCE=""
          CHORES=""

          REPO_URL="https://github.com/reyyuuki/Azyx"

          while IFS='|||' read -r HASH MESSAGE; do
            [ -z "$HASH" ] && continue

            CLEAN_MESSAGE=$(echo "$MESSAGE" | sed 's/#[0-9]\+//g' | sed 's/[^a-zA-Z0-9 .,:!-]//g' | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')

            if [[ "$MESSAGE" =~ ^feat: ]]; then
              DESCR=$(echo "$CLEAN_MESSAGE" | sed 's/^feat://')
              COMMIT_LINK="[֍]($REPO_URL/commit/$HASH)"
              FEATURES+="- $COMMIT_LINK $DESCR"$'\n'
            elif [[ "$MESSAGE" =~ ^fix:|^bug:|^improvement:|^patch: ]]; then
              DESCR=$(echo "$CLEAN_MESSAGE" | sed 's/^fix://' | sed 's/^bug://' | sed 's/^improvement://' | sed 's/^patch://')
              COMMIT_LINK="[֍]($REPO_URL/commit/$HASH)"
              BUG_FIXES+="- $COMMIT_LINK $DESCR"$'\n'
            elif [[ "$MESSAGE" =~ ^refactor: ]]; then
              DESCR=$(echo "$CLEAN_MESSAGE" | sed 's/^refactor://')
              COMMIT_LINK="[֍]($REPO_URL/commit/$HASH)"
              REFACTORS+="- $COMMIT_LINK $DESCR"$'\n'
            elif [[ "$MESSAGE" =~ ^style: ]]; then
              DESCR=$(echo "$CLEAN_MESSAGE" | sed 's/^style://')
              COMMIT_LINK="[֍]($REPO_URL/commit/$HASH)"
              STYLE_CHANGES+="- $COMMIT_LINK $DESCR"$'\n'
            elif [[ "$MESSAGE" =~ ^perf: ]]; then
              DESCR=$(echo "$CLEAN_MESSAGE" | sed 's/^perf://')
              COMMIT_LINK="[֍]($REPO_URL/commit/$HASH)"
              PERFORMANCE+="- $COMMIT_LINK $DESCR"$'\n'
            elif [[ "$MESSAGE" =~ ^chore:|^docs:|^build:|^ci: ]]; then
              DESCR=$(echo "$CLEAN_MESSAGE" | sed 's/^chore://' | sed 's/^docs://' | sed 's/^build://' | sed 's/^ci://')
              COMMIT_LINK="[֍]($REPO_URL/commit/$HASH)"
              CHORES+="- $COMMIT_LINK $DESCR"$'\n'
            fi
          done < main-repo/commits.tmp

          {
            echo "### 🆕 Beta Changelog"
            echo ""
            echo "> ⚠️ **This is a Beta Release.** Features and fixes in this version are still under testing and may contain bugs or unexpected behavior. Please report any issues you encounter. Do not use in production."
            echo ""
            if [ -n "$FEATURES" ]; then
              echo "### 🌟 Features"
              echo -e "$FEATURES"
              echo ""
            fi
            if [ -n "$BUG_FIXES" ]; then
              echo "### 🔧 Bug Fixes & Improvements"
              echo -e "$BUG_FIXES"
              echo ""
            fi
            if [ -n "$REFACTORS" ]; then
              echo "### 🔧 Refactors"
              echo -e "$REFACTORS"
              echo ""
            fi
            if [ -n "$STYLE_CHANGES" ]; then
              echo "### 🎨 Style Changes"
              echo -e "$STYLE_CHANGES"
              echo ""
            fi
            if [ -n "$PERFORMANCE" ]; then
              echo "### 🚀 Performance Improvements"
              echo -e "$PERFORMANCE"
              echo ""
            fi
            if [ -n "$CHORES" ]; then
              echo "### 🧹 Chores & Documentation"
              echo -e "$CHORES"
              echo ""
            fi
          } > CHANGELOG.md

          CURRENT_TAG_SAFE=$(echo "${{ steps.resolve_tag.outputs.current_tag }}" | sed 's/[^a-zA-Z0-9.-]//g')
          echo "![Total Downloads](https://img.shields.io/github/downloads/${{ github.repository }}/total?style=for-the-badge&label=TOTAL%20DOWNLOADS&labelColor=black&color=white) ![Beta Release](https://img.shields.io/github/downloads/${{ github.repository }}/${CURRENT_TAG_SAFE}/total?style=for-the-badge&label=BETA%20RELEASE&labelColor=black&color=white)" >> CHANGELOG.md

          rm -f main-repo/commits.tmp
        shell: /usr/bin/bash -e {0}

      - name: Debug CHANGELOG.md
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        run: cat CHANGELOG.md

      - name: Save Commit SHA Files
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        run: |
          CURRENT_SHA="${{ steps.get_current_commit.outputs.current_commit }}"
          echo "$CURRENT_SHA" > .next-beta-commit
          if [ ! -f ".last-beta-commit" ]; then
            echo "$CURRENT_SHA" > .last-beta-commit
          fi

      - name: Commit and Push Changelog + Commit Tracking
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        run: |
          CURRENT_SHA="${{ steps.get_current_commit.outputs.current_commit }}"
          git config --global user.name "Git Paneer"
          git config --global user.email "actions@github.com"
          echo "$CURRENT_SHA" > .last-beta-commit
          git add CHANGELOG.md .last-beta-commit .next-beta-commit
          git commit --allow-empty -m "Update beta changelog for ${{ steps.resolve_tag.outputs.current_tag }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create or Update Beta Release
        if: ${{ steps.check_jobs.outputs.all_jobs_success == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: CHANGELOG.md
          tag: ${{ steps.resolve_tag.outputs.current_tag }}
          allowUpdates: true
